name: Deploy Worker (taostudioai.com)

# 2026-11-25 结构：
#   taostudioai.com = 桃子AI画廊 + /lab（站点源站 = R2 桶 taostudio-gallery，
#   由 tao-image-gallery 仓库的 Deploy Gallery / MeiGen 采集流水线增量同步）
#   本仓库只负责 Worker 本身：路由、旧路径 410、/api/translate 等。
#
# 需要的 repository secrets（已配置）：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
#   token 需要 Workers Scripts:Edit；R2 绑定在 wrangler.toml 里声明。

on:
  push:
    branches: [main]
    paths:
      - "cf-worker/**"
      - "src/server/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cf-worker/wrangler.toml

      - name: Smoke test
        run: |
          set -e
          fail=0
          check() { # path expected
            code=$(curl -s -o /dev/null -m 30 -w "%{http_code}" "https://taostudioai.com$1" || echo 000)
            echo "$1 -> $code (want $2)"
            [ "$code" = "$2" ] || fail=1
          }
          check / 200
          check /lab/ 200
          check /sitemap.xml 200
          # 旧应用已下线：/case/* 必须 410，/cases 必须 301
          check /case/anything 410
          code=$(curl -s -o /dev/null -m 30 -w "%{http_code}" "https://taostudioai.com/cases" || echo 000)
          echo "/cases -> $code (want 301)"
          [ "$code" = "301" ] || fail=1
          # cases 子域收口到主域
          loc=$(curl -s -o /dev/null -m 30 -w "%{http_code} %{redirect_url}" "https://cases.taostudioai.com/" || echo "000 ")
          echo "cases -> $loc"
          case "$loc" in 301*https://taostudioai.com/*) : ;; *) fail=1 ;; esac
          [ "$fail" = "0" ] || { echo "smoke test failed"; exit 1; }
