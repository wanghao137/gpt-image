name: Deploy Cloudflare

# Replaces "push to main -> Vercel builds" while the Vercel Hobby team is
# paused for edgeRequest overage (blocked 2026-11-24, unpause 2026-12-24).
# Live stack: Cloudflare Worker `taostudioai` + R2 origin, case images still
# proxied from the private B2 bucket. See cf-worker/index.js for the routing
# rules and scripts/deploy-cloudflare.mjs for the incremental R2 sync.
#
# Deploy shape:
#   1. full SSG build (same chain Vercel used: scripts/vercel-build.mjs)
#   2. incremental dist -> R2 (MD5/ETag diff, so steady-state uploads are ~0)
#   3. wrangler deploy (idempotent; ~10s)
#
# Required repository secrets:
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   CLOUDFLARE_API_TOKEN   (Workers Scripts:Edit on the account)
#   CLOUDFLARE_ACCOUNT_ID
#   B2_STORE_KEY_ID / B2_STORE_APP_KEY  (build-time image pipeline; already set for sync.yml)
#
# Worker runtime secrets (B2_STORE_*, KV_REST_API_*, HERMES_*) are set once via
#   cd cf-worker && npx wrangler secret put <NAME>
# and are NOT touched by this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize deploys; never cancel a run mid-upload (R2 would be left half-updated).
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  R2_SITE_BUCKET: taostudio-site
  R2_ASSETS_BUCKET: taostudio-cases-assets

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (SSG + postbuild)
        env:
          VITE_ADMIN_PASSWORD_HASH: ${{ vars.VITE_ADMIN_PASSWORD_HASH }}
          VITE_ADMIN_REPO_OWNER: ${{ github.repository_owner }}
          VITE_ADMIN_REPO_NAME: ${{ github.event.repository.name }}
          VITE_ADMIN_REPO_BRANCH: ${{ github.ref_name }}
          B2_STORE_KEY_ID: ${{ secrets.B2_STORE_KEY_ID }}
          B2_STORE_APP_KEY: ${{ secrets.B2_STORE_APP_KEY }}
          B2_STORE_BUCKET: taostudio-img
          B2_STORE_REGION: us-east-005
        run: npm run vercel-build

      - name: Sync dist to R2 (incremental)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        # --prune removes objects that the build no longer produces, but the
        # script refuses when the artifact count looks truncated.
        run: node scripts/deploy-cloudflare.mjs --prune

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cf-worker/wrangler.toml

      - name: Smoke test
        run: |
          set -e
          fail=0
          for p in / /cases /lab /sitemap.xml /robots.txt /data/cases-home.json /images/cases/case100003-1280.webp; do
            code=$(curl -s -o /dev/null -m 30 -w "%{http_code}" "https://taostudioai.com$p" || echo 000)
            echo "$p -> $code"
            [ "$code" = "200" ] || fail=1
          done
          if [ "$fail" = "1" ]; then echo "smoke test failed"; exit 1; fi
