name: Daily Upstream Sync

# Runs `npm run sync` once a day, then commits generated data and the durable
# upstream locale cache used when the public translation sources are delayed.
# A push to main triggers the live Vercel deployment automatically. Pushes
# created with GITHUB_TOKEN do not trigger other GitHub Actions workflows, so
# this workflow explicitly dispatches the GH Pages fallback after a data commit.
#
# Why a separate workflow:
#   - The old all-in-one `deploy.yml` cron only rebuilt the GH Pages mirror
#     after the Vercel migration. Vercel does NOT poll for upstream changes;
#     it only redeploys when something actually changes in git.
#   - Splitting sync from deploy means data refreshes even on days when no
#     code changes happen, and the resulting commit is the single trigger
#     for every downstream deploy target.

on:
  schedule:
    # 18:17 UTC ≈ 02:17 CST. Off-peak for both upstream CDNs and Vercel.
    # Second slot: GitHub skips/delays scheduled runs occasionally (the
    # 2026-10-12 run vanished entirely, extending a bake-gate freeze by a
    # full day) — the evening slot reconciles a missed nightly run the same
    # night. sync is idempotent, so a double run costs nothing.
    - cron: "17 18 * * *"
    - cron: "47 21 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  # Don't queue parallel sync runs — if a manual run is in flight, skip
  # the cron rather than racing it. New data will land on the next slot.
  # IMPORTANT: this group is SHARED with content.yml so a content-triggered
  # regenerate and this daily cron serialize against each other rather than
  # both PATCHing main. If you rename it here, rename it there too.
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Job-level so the push-retry re-bake below also runs in store mode.
    env:
      B2_STORE_KEY_ID: ${{ secrets.B2_STORE_KEY_ID }}
      B2_STORE_APP_KEY: ${{ secrets.B2_STORE_APP_KEY }}
      B2_STORE_BUCKET: taostudio-img
      B2_STORE_REGION: us-east-005
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need full history so the auto-commit shows up cleanly on main.
          fetch-depth: 1
          # Use the default GITHUB_TOKEN; pushes to protected branches
          # require Settings → Actions → Workflow permissions =
          # "Read and write permissions".
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync upstream → public/data/
        # `--optional` keeps a partial build from blowing up on a transient
        # CDN outage, but here we want hard failure: if upstream is down we
        # don't want to commit a half-empty cases.json. So omit it.
        run: npm run sync

      - name: Apply v2 field migration
        # Idempotent — re-runs are no-ops if all fields are already present.
        # Doing it here keeps a manual sync + commit path producing the
        # exact same on-disk shape as a full local `npm run build`.
        run: npm run migrate

      - name: Purge noncurrent object versions
        # The bucket is versioned: overwrites (failed-bake retries, force
        # re-bakes) leave noncurrent versions that still count against the
        # 10GB free cap. Left alone they silently re-fill the bucket — the
        # hidden co-conspirator of the 2026-10-13 freeze (0.35GB in 2407
        # versions on day one). Sweeping every run keeps
        # current+noncurrent equal to the manifest the capacity guard
        # plans against. ~100 free-tier list calls per run.
        env:
          B2_STORE_KEY_ID: ${{ secrets.B2_STORE_KEY_ID }}
          B2_STORE_APP_KEY: ${{ secrets.B2_STORE_APP_KEY }}
          B2_STORE_BUCKET: taostudio-img
        # Non-fatal: on a transaction-cap-exhausted day the listing itself
        # is rejected; skipping the sweep must not freeze the sync (the
        # budget margin absorbs the noncurrent residue until tomorrow).
        run: node scripts/purge-noncurrent-versions.mjs || echo "::warning::noncurrent purge skipped (likely daily transaction cap) — margin absorbs residue"

      - name: Bake case images to the B2 store
        # Store mode: localise every external case/template image into the
        # B2 store and rewrite imageUrl to /images/cases/* (served same-origin
        # via a Vercel proxy rewrite). Resume-safe via data/image-store.json.
        env:
          B2_STORE_KEY_ID: ${{ secrets.B2_STORE_KEY_ID }}
          B2_STORE_APP_KEY: ${{ secrets.B2_STORE_APP_KEY }}
          B2_STORE_BUCKET: taostudio-img
          B2_STORE_REGION: us-east-005
        run: node scripts/build-images.mjs --store
      - name: Regenerate derived shards
        # sync rewrites public/data/cases.json but not the shards/index/search
        # files; without this step the checked-in artifacts drift apart and
        # data-consistency.test.mjs fails (root cause of the long-red main).
        run: node scripts/split-data.mjs

      - name: Verify (typecheck + tests)
        # Gate: do not commit/push regenerated data that fails the suite.
        run: npm run check

      - name: Detect changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- public/data data/manual data/upstream-case-times.json data/upstream-locales.json data/image-store.json public/images)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- public/data data/manual data/upstream-case-times.json data/upstream-locales.json data/image-store.json public/images
          fi

      - name: Commit and push
        id: push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Self-healing commit+push. See content.yml for the full rationale —
          # `concurrency: data-sync` serializes Actions runs against each
          # other but cannot serialize against Hermes's external push to
          # main. On push reject we rebase onto latest main, re-run
          # sync+migrate on the fresh tree (idempotent; migrate never
          # touches data/manual/*), and retry up to 2 times. Final give-up
          # exits 0 — a later cron slot or content push will reconcile.
          attempt=0
          max_attempts=3   # 1 initial + 2 retries
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "::group::Commit & push attempt $attempt/$max_attempts"
            if [ $attempt -gt 1 ]; then
              echo "Push was rejected on the previous attempt (likely a concurrent Hermes push). Rebasing onto latest main and re-running sync+migrate..."
              git fetch origin main
              git reset --hard origin/main
              npm run sync
              npm run migrate
              node scripts/split-data.mjs
              # reset --hard dropped this run's bake manifest — regenerate it
              # (store mode, idempotent vs the bucket) so the next daily bake
              # doesn't re-upload everything.
              node scripts/build-images.mjs --store
              npm run check
            fi
            git add public/data data/manual data/upstream-case-times.json data/upstream-locales.json data/image-store.json public/images
            if [ -z "$(git diff --cached --name-only -- public/data data/manual data/upstream-case-times.json data/upstream-locales.json data/image-store.json public/images)" ]; then
              echo "No data changes after re-sync — nothing to commit."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              echo "::endgroup::"
              break
            fi
            # Pull a one-line summary for the commit body so the history is
            # actually scannable instead of a wall of "auto sync" entries.
            summary=$(git diff --cached --stat -- public/data data/upstream-case-times.json data/upstream-locales.json | tail -n 1 | sed 's/^ *//')
            git commit -m "data(sync): daily upstream refresh" \
              -m "Triggered by ${GITHUB_EVENT_NAME} on $(date -u +%Y-%m-%d) UTC" \
              -m "Changes: ${summary}"
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "::endgroup::"
              break
            else
              echo "::endgroup::"
              if [ $attempt -lt $max_attempts ]; then
                echo "Push rejected — will retry on latest main."
              else
                echo "::warning::Max attempts reached ($max_attempts). Concurrent pushes are still landing on main; a later cron slot or content push will reconcile. Exiting 0 — this is not a real failure."
                echo "pushed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          done

      - name: Trigger GitHub Pages deployment
        if: steps.diff.outputs.changed == 'true' && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Summary
        run: |
          if [ "${{ steps.push.outputs.pushed }}" = "true" ]; then
            echo "✅ Pushed updated data to main; Vercel will redeploy automatically." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "⚠️ Data had changes but push was deferred (concurrent commits on main). The next sync slot will reconcile." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Upstream is already in sync — no commit, no redeploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Freshness & capacity watchdog
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node scripts/upstream-freshness.mjs | tee freshness.txt
          new3=$(sed -n 's/^upstream_new_3d=//p' freshness.txt)
          new7=$(sed -n 's/^upstream_new_7d=//p' freshness.txt)
          {
            echo "### Upstream freshness"
            echo "- new upstream cases in 3d: **${new3:-unknown}**"
            echo "- new upstream cases in 7d: **${new7:-unknown}**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${new3:-1}" = "0" ] || [ "${new7:-1}" = "0" ]; then
            gh label create upstream-stale --color D93F0B --description "YouMind export stalled" 2>/dev/null || true
            open_count=$(gh issue list --label upstream-stale --state open --json number --jq length)
            if [ "${open_count:-0}" -eq 0 ]; then
              gh issue create \
                --label upstream-stale \
                --title "上游 YouMind 同步近期零新增" \
                --body "daily sync 成功但最近窗口无新增上游案例 (3d=${new3:-?}, 7d=${new7:-?})。上次断供发生在 2026-08-01 并于当月中旬自愈；排查入口：references manifest 是否仍在更新。"
              echo "::warning::Created upstream-staleness issue."
            else
              echo "Staleness issue already open (${open_count}) — not duplicating."
            fi
          else
            echo "Upstream is flowing — no alert needed."
          fi

          # Store capacity (root cause of the 2026-10-11..13 freeze): bake
          # uploads died on B2's 10GB cap, the hot-link gate failed, and the
          # daily sync froze for days with no in-repo signal. The guard now
          # self-evicts, but the pool is finite — surface its runway loudly
          # before anything user-visible goes stale.
          if [ -f data/image-store.json ]; then
            node -e '
              const m = JSON.parse(require("fs").readFileSync("data/image-store.json","utf8"));
              const entries = Object.values(m.entries || {});
              let used = 0, poolRungs = 0, poolBytes = 0, deferred = 0;
              for (const e of entries) {
                if (!e || e.deferred) { if (e && e.deferred) deferred += 1; continue; }
                used += e.jpgBytes || 0;
                for (const b of Object.values(e.webpBytes || {})) used += b || 0;
                const r = e.webpBytes && e.webpBytes[1280];
                if (r) { poolRungs += 1; poolBytes += r; }
              }
              console.log(`store_used_gb=${(used / 1e9).toFixed(2)}`);
              console.log(`store_pool_rungs=${poolRungs}`);
              console.log(`store_pool_gb=${(poolBytes / 1e9).toFixed(2)}`);
              console.log(`store_deferred=${deferred}`);
            ' | tee capacity.txt
            used_gb=$(sed -n 's/^store_used_gb=//p' capacity.txt)
            pool_rungs=$(sed -n 's/^store_pool_rungs=//p' capacity.txt)
            pool_gb=$(sed -n 's/^store_pool_gb=//p' capacity.txt)
            deferred=$(sed -n 's/^store_deferred=//p' capacity.txt)
            {
              echo "### Store capacity"
              echo "- used: **${used_gb:-?} GB** / 10 GB hard cap (budget 9.65 GB — the bake auto-evicts old 1280 rungs to stay under)"
              echo "- evictable 1280 pool: ${pool_rungs:-?} rungs / ${pool_gb:-?} GB"
              echo "- deferred (held out of the site until their bake succeeds): **${deferred:-0}**"
            } >> "$GITHUB_STEP_SUMMARY"
            gh label create image-store-capacity --color D93F0B --description "B2 image store nearing/exceeding free cap" 2>/dev/null || true
            needs_issue=0
            title=""
            body=""
            if [ "${deferred:-0}" != "0" ]; then
              needs_issue=1
              title="图片桶容量耗尽：${deferred} 个新案例延迟入库"
              body="容量守卫已淘汰全部可淘汰的 1280 档仍放不下新烘焙。受影响案例暂时不上站（绝不外链发布，站内其余内容不受影响，烘焙成功后自动补上）。扩容选项：R2 溢出桶 / 档位瘦身 / B2 付费层。运行：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            else
              low=$(node -e "console.log(${pool_gb:-0} < 0.5 ? 1 : 0)")
              if [ "$low" = "1" ]; then
                needs_issue=1
                title="图片桶 1280 淘汰池接近枯竭（剩 ${pool_gb:-?} GB）"
                body="按 ~28MB/天 增量，约两周后新案例将开始延迟入库。扩容选项：R2 溢出桶 / 档位瘦身 / B2 付费层。运行：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              fi
            fi
            if [ "$needs_issue" = "1" ]; then
              open_count=$(gh issue list --label image-store-capacity --state open --json number --jq length)
              if [ "${open_count:-0}" -eq 0 ]; then
                gh issue create --label image-store-capacity --title "$title" --body "$body"
                echo "::warning::Created image-store-capacity issue."
              else
                echo "Capacity issue already open (${open_count}) — not duplicating."
              fi
            fi
          fi

      - name: Alert on sync failure (site data goes stale)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create data-sync-failed --color D93F0B --description "sync.yml failed; upstream data going stale on the site" 2>/dev/null || true
          open_count=$(gh issue list --label data-sync-failed --state open --json number --jq length)
          if [ "${open_count:-0}" -eq 0 ]; then
            gh issue create \
              --label data-sync-failed \
              --title "sync.yml 每日同步失败：站点上游数据停更" \
              --body "运行链接：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} 。已知根因先例（2026-10-13）：B2 桶容量超限 → 烘焙失败 → 外链门禁红。修复后手动 dispatch「Daily Upstream Sync」即可补上线。"
            echo "::warning::Created data-sync-failed issue."
          else
            echo "Failure issue already open (${open_count}) — not duplicating."
          fi
